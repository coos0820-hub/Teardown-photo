<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拆解照片 直傳測試</title>
<style>
:root{--blue:#1565C0;--green2:#2E7D32;--grey2:#546E7A;--border:#D0D7DE}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei','PingFang TC',system-ui,sans-serif;background:#F0F2F5;color:#212121;font-size:15px;line-height:1.5}
.ph{background:linear-gradient(135deg,#0D1B2A,#1B2D44);color:#fff;padding:12px 16px;border-bottom:3px solid #E53935}
.ph h1{font-size:16px}.ph .sub{font-size:11px;color:#90CAF9}
.main{padding:12px;max-width:640px;margin:0 auto}
.card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px}
label{display:block;font-size:13px;font-weight:700;color:var(--grey2);margin:10px 0 4px}
.inp{width:100%;border:1.5px solid var(--border);border-radius:6px;padding:8px 10px;font-size:16px;font-family:inherit}
.btn{display:block;width:100%;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;color:#fff;background:var(--green2);margin-top:12px}
.log{font-size:12.5px;background:#ECEFF1;border-radius:6px;padding:8px;margin-top:10px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="ph"><h1>📷 拆解照片 · 直傳測試</h1><div class="sub">不經郵件，照片直接送到 Power Automate → SharePoint</div></div>
<div class="main"><div class="card">
  <label>流程 HTTP URL（儲存流程後複製貼上，只需貼一次）</label><input class="inp" id="url" placeholder="https://...">
  <label>工單號 WO</label><input class="inp" id="wo" value="WO2026100520101">
  <label>照片（可多選，或直接拍照）</label><input type="file" id="pics" accept="image/*" multiple>
  <button class="btn" onclick="send()">📤 直接上傳</button>
  <div class="log" id="log">等待測試…</div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const L=t=>{$('log').textContent+= '\n'+t};
try{$('url').value=localStorage.getItem('ht_url')||''}catch(e){}
$('url').onchange=()=>{try{localStorage.setItem('ht_url',$('url').value.trim())}catch(e){}};
function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image();
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',q).split(',')[1])};
  img.onerror=()=>rej(new Error('讀不到照片'));img.src=URL.createObjectURL(file)})}
async function send(){
  const url=$('url').value.trim(),files=[...$('pics').files];
  $('log').textContent='開始';
  if(!url.startsWith('https://')){L('⚠ 請先貼上流程 URL');return}
  if(!files.length){L('⚠ 請先選照片');return}
  for(let i=0;i<files.length;i++){
    const name=`03_機構_${String(i+1).padStart(2,'0')}.jpg`;
    try{
      const b64=await shrink(files[i],1600,0.8);
      const t0=Date.now();
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({wo:$('wo').value.trim(),name,b64})});
      const txt=await r.text();
      L(`${name}：${Math.round(b64.length*0.75/1024)} KB → HTTP ${r.status}（${((Date.now()-t0)/1000).toFixed(1)} 秒）${txt.slice(0,120)}`);
    }catch(e){L(`${name}：❌ ${e.message}（若 SharePoint 仍有收到檔案，代表是瀏覽器跨網域限制，回報即可）`)}
  }
  L('完成，請到 SharePoint 測試資料夾確認');
}
</script>
</body>
</html>
